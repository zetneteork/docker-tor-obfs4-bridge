name: Lint & Test

on:
  push:
    branches-ignore: [main]   # main is covered by the release workflow's own build
  pull_request:
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Validates workflow YAML/expressions and, when shellcheck is on PATH
      # (it is on ubuntu-latest), lints every `run:` step's shell too.
      - name: actionlint
        uses: reviewdog/action-actionlint@v1.76.0
        with:
          fail_level: error

      - name: Shellcheck standalone scripts
        run: shellcheck start-tor.sh get-bridge-line docker_start.sh export.sh scripts/*.sh

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run version/release-plan unit tests
        run: bash scripts/test-release-plan.sh

  bats-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run start-tor.sh bats tests
        run: bats tests/start-tor.bats

      - name: Run get-bridge-line bats tests
        run: bats tests/get-bridge-line.bats

      # Static guards: verify Kubernetes manifests use the correct UID/GID
      # (runAsUser: 100, runAsGroup: 101, fsGroup: 101 matching debian-tor).
      # Regression guard for the /etc/tor/torrc: Permission denied bug.
      - name: Run k8s-manifests bats tests
        run: bats tests/k8s-manifests.bats

  build-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64 only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: tor-obfs4-bridge:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install bats-core (for image-permissions tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run image-permissions bats tests
        # Verifies debian-tor uid=100/gid=101, directory ownership,
        # and that uid 100 can write /etc/tor (the torrc write).
        # Regression guard for the Kubernetes Permission denied crash.
        env:
          IMAGE: tor-obfs4-bridge:smoke-test
        run: bats tests/image-permissions.bats

      - name: Run container and verify Tor starts
        run: |
          docker run -d --name smoke-test \
            -e OR_PORT=12345 \
            -e PT_PORT=12346 \
            -e EMAIL=test@example.com \
            -e TOR_OR_PORT_IPV4=1 \
            -e TOR_EXITRELAY=0 \
            -e TOR_BRIDGERELAY=1 \
            tor-obfs4-bridge:smoke-test

          sleep 10

          echo "--- container logs ---"
          docker logs smoke-test

          # Regression guard: fail immediately if Permission denied appears.
          # This is the exact error that was reported in the Kubernetes deployment
          # caused by running as uid 101 instead of uid 100 (debian-tor).
          if docker logs smoke-test 2>&1 | grep -q 'Permission denied'; then
            echo "::error::Container logs contain 'Permission denied'."
            echo "::error::This indicates a UID/GID mismatch between the manifest"
            echo "::error::and the image. debian-tor in the image is uid=100/gid=101."
            echo "::error::Kubernetes manifests must use runAsUser: 100."
            docker logs smoke-test 2>&1
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" != "true" ]; then
            echo "::error::Container exited unexpectedly, see logs above."
            docker inspect -f 'Exit code: {{.State.ExitCode}}' smoke-test
            exit 1
          fi

          if ! docker logs smoke-test 2>&1 | grep -q 'starting tor\.'; then
            echo "::error::Tor did not report starting."
            exit 1
          fi

          if ! docker exec smoke-test grep -q 'ORPort 12345' /etc/tor/torrc; then
            echo "::error::Generated torrc is missing the expected ORPort line."
            docker exec smoke-test cat /etc/tor/torrc
            exit 1
          fi

          docker stop smoke-test
