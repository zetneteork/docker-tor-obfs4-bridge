apiVersion: v1
kind: Service
metadata:
  name: tor-obfs4-bridge
  namespace: tor
  labels:
    app.kubernetes.io/name: tor-obfs4-bridge
    app.kubernetes.io/component: network
spec:
  type: LoadBalancer
  # externalTrafficPolicy: Local preserves the real client source IP
  # and avoids double-NAT on clouds that support it.
  externalTrafficPolicy: Local
  ports:
    - name: orport
      port: 2123
      targetPort: orport
      protocol: TCP
    - name: ptport
      port: 2133
      targetPort: ptport
      protocol: TCP
  selector:
    app.kubernetes.io/name: tor-obfs4-bridge
