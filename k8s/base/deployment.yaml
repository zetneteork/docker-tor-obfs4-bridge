apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-obfs4-bridge
  namespace: tor
  labels:
    app.kubernetes.io/name: tor-obfs4-bridge
    app.kubernetes.io/component: bridge
spec:
  # A Tor bridge MUST run as a single replica – running more than one on the
  # same external IP with the same key directory is unsupported.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tor-obfs4-bridge
  # Recreate (not RollingUpdate) avoids two pods sharing the data dir.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor-obfs4-bridge
        app.kubernetes.io/component: bridge
    spec:
      # Run as the debian-tor user.
      # In the official Debian tor package debian-tor is uid=100, gid=101.
      # Using uid 101 (wrong) causes "Permission denied" writing /etc/tor/torrc
      # because /etc/tor is owned by uid 100 mode 755.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # Fix volume ownership before Tor starts.
      # Kubernetes mounts PVCs and emptyDirs owned by root (uid 0).
      # Tor refuses to use DataDirectory /var/lib/tor unless it is owned
      # by the running user (debian-tor uid=100). fsGroup sets the group
      # but not the owner uid. This initContainer runs chown as root.
      # chmod is NOT used – it requires FOWNER capability which is not
      # granted; the correct modes (700/750) are already set in the image.
      initContainers:
        - name: fix-volume-ownership
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # chown the volume mounts so Tor's DataDirectory is owned by
              # debian-tor (uid=100, gid=101).  || true prevents a crash loop
              # on storage backends (e.g. minikube hostpath) where the chown
              # syscall is blocked by the host UID namespace mapping.
              chown -R 100:101 /var/lib/tor /var/log/tor || true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/tor
            - name: logdir
              mountPath: /var/log/tor

      containers:
        - name: tor-obfs4-bridge
          # Image is patched by the release workflow via kustomize image tag.
          image: ghcr.io/zetneteork/docker-tor-obfs4-bridge:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # tor writes state files at runtime
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]    # needed so obfs4proxy can bind < 1024

          env:
            - name: OR_PORT
              value: "2123"
            - name: PT_PORT
              value: "2133"
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: tor-config
                  key: email
            - name: TOR_OR_PORT_IPV4
              value: "1"
            - name: TOR_EXITRELAY
              value: "0"
            - name: TOR_BRIDGERELAY
              value: "1"

          ports:
            - name: orport
              containerPort: 2123
              protocol: TCP
            - name: ptport
              containerPort: 2133
              protocol: TCP

          # Tor takes up to ~2 minutes to bootstrap and register with the network.
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "tor"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -q 'Bootstrapped 100%' /var/log/tor/log 2>/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - name: datadir
              mountPath: /var/lib/tor
            - name: logdir
              mountPath: /var/log/tor

      volumes:
        - name: datadir
          persistentVolumeClaim:
            claimName: tor-datadir
        - name: logdir
          emptyDir: {}
