# kube-deployment.yml – Single-file convenience manifest for kubectl apply.
#
# This file is kept in sync with the image version automatically by the
# release workflow (docker-build-and-release.yml).
#
# For production deployments consider using the kustomize layout instead:
#   kubectl apply -k k8s/overlays/example/
#
# The kustomize base (k8s/base/) includes proper security hardening:
#   - non-root user (debian-tor, uid=100 gid=101 in the Debian tor package)
#   - capability drop ALL + NET_BIND_SERVICE only
#   - seccomp RuntimeDefault
#   - resource requests/limits
#   - liveness/readiness probes
#
# To create the required secret before applying:
#   kubectl create namespace tor
#   kubectl create secret generic tor-config \
#     --namespace tor \
#     --from-literal=email=tor@example.org
---
apiVersion: v1
kind: Namespace
metadata:
  name: tor
  labels:
    name: tor
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tor-datadir
  namespace: tor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tor-obfs4-bridge
  namespace: tor
  labels:
    app.kubernetes.io/name: tor-obfs4-bridge
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: orport
      port: 2123
      targetPort: orport
      protocol: TCP
    - name: ptport
      port: 2133
      targetPort: ptport
      protocol: TCP
  selector:
    app.kubernetes.io/name: tor-obfs4-bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-obfs4-bridge
  namespace: tor
  labels:
    app.kubernetes.io/name: tor-obfs4-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tor-obfs4-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor-obfs4-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Fix volume ownership before Tor starts.
      # Kubernetes mounts PVCs and emptyDirs owned by root (uid 0).
      # Tor refuses DataDirectory /var/lib/tor unless owned by uid 100.
      # chmod is NOT used – requires FOWNER capability which is not granted.
      initContainers:
        - name: fix-volume-ownership
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # chown the volume mounts so Tor's DataDirectory is owned by
              # debian-tor (uid=100, gid=101).  || true prevents a crash loop
              # on storage backends (e.g. minikube hostpath) where the chown
              # syscall is blocked by the host UID namespace mapping.
              chown -R 100:101 /var/lib/tor /var/log/tor || true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/tor
            - name: logdir
              mountPath: /var/log/tor
      containers:
        - name: tor-obfs4-bridge
          image: zetneteork/tor-obfs4-bridge:0.4.9.12-1-d13.trixie-1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          env:
            - name: OR_PORT
              value: "2123"
            - name: PT_PORT
              value: "2133"
            - name: EMAIL
              value: "tor@opentree.cz"
            - name: TOR_OR_PORT_IPV4
              value: "1"
            - name: TOR_EXITRELAY
              value: "0"
            - name: TOR_BRIDGERELAY
              value: "1"
          ports:
            - name: orport
              containerPort: 2123
              protocol: TCP
            - name: ptport
              containerPort: 2133
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "tor"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -q 'Bootstrapped 100%' /var/log/tor/log 2>/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/tor
            - name: logdir
              mountPath: /var/log/tor
      volumes:
        - name: datadir
          persistentVolumeClaim:
            claimName: tor-datadir
        - name: logdir
          emptyDir: {}
